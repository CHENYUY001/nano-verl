[project]
name = "nanoverl"
version = "0.1.0"
description = "A lightweight Verl implementation built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "wandb",
]

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }